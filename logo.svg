<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5f4a"/>
      <stop offset="100%" stop-color="#2dbf7f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="94" fill="url(#lg)" opacity="0.06"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#lg)" stroke-width="1.2"/>

  <!-- Building mass – solid geometric form with FF carved as negative space -->
  <!-- The solid represents built mass, the carved areas reveal FF -->
  <g fill="#0f5f4a" opacity="0.92">
    <!-- Top bar -->
    <rect x="40" y="40" width="120" height="14" rx="1"/>
    <!-- Left column -->
    <rect x="40" y="40" width="14" height="120" rx="1"/>
    <!-- Bottom bar -->
    <rect x="40" y="146" width="120" height="14" rx="1"/>
    <!-- Middle divider -->
    <rect x="100" y="40" width="14" height="120" rx="1"/>
    <!-- Right column top -->
    <rect x="146" y="40" width="14" height="60" rx="1"/>
  </g>

  <!-- Green accent blocks -->
  <rect x="40" y="54" width="60" height="6" rx="1" fill="#2dbf7f" opacity="0.7"/>
  <rect x="40" y="96" width="60" height="6" rx="1" fill="#2dbf7f" opacity="0.7"/>
  <rect x="114" y="54" width="32" height="6" rx="1" fill="#2dbf7f" opacity="0.5"/>

  <!-- Central void – urban space -->
  <rect x="54" y="60" width="46" height="36" rx="1" fill="#ffffff" opacity="0.0"/>
  <rect x="54" y="102" width="116" height="44" rx="1" fill="#ffffff" opacity="0.0"/>

  <!-- Typography -->
  <text x="100" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="url(#lg)" letter-spacing="5">FF</text>
</svg>
